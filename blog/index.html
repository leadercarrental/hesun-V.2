[PAIR:images/island7days/rocky-coast.jpg|images/island7days/cave.jpg]

    function renderContent(raw) {
      const lines = raw.split('\n');

      let i = 0;

      while (i < lines.length) {

        // 略過空行

        // [YOUTUBE:id] YouTube 嵌入（中國版顯示提示）

                  'allowfullscreen loading="lazy"></iframe>' +
                '</div>'
              );
            }
          }
          i++; continue;
        }

        // [VIDEO:path] 影片
        if (line.startsWith('[VIDEO:')) {
          const m = line.match(/\[VIDEO:([^\]]+)\]/);
          if (m) {
            html.push(
              '<figure class="article-video-wrap">' +
                '<video controls playsinline preload="metadata">' +
                  '<source src="' + m[1].trim() + '" type="video/mp4">' +
                  '<source src="' + m[1].trim() + '" type="video/quicktime">' +
                '</video>' +
              '</figure>'
            );
          }
          i++; continue;
        }

        // [PAIR:img1|img2] 雙圖並排
        if (line.startsWith('[PAIR:')) {
          const m = line.match(/\[PAIR:([^|]+)\|([^\]]+)\]/);
          if (m) {
            html.push(
              '<div class="image-pair">' +
                '<figure><img src="' + m[1].trim() + '" loading="lazy" alt=""></figure>' +
                '<figure><img src="' + m[2].trim() + '" loading="lazy" alt=""></figure>' +
              '</div>'
            );
          }
          i++; continue;
        }

        // [IMAGE:path] 或 [IMAGE:path|圖說]
        if (line.startsWith('[IMAGE:')) {
          const m = line.match(/\[IMAGE:([^|\]]+)(?:\|([^\]]+))?\]/);
          if (m) {
            const src = m[1].trim();
            const cap = m[2] ? m[2].trim() : '';
            html.push(
              '<figure>' +
                '<img src="' + src + '" alt="' + cap + '" loading="lazy">' +
                (cap ? '<figcaption>' + cap + '</figcaption>' : '') +
              '</figure>'
            );
          }
          i++; continue;
        }

        // 【標題】
        if (line.startsWith('【')) {
          const m = line.match(/【([^】]+)】(.*)/);
          if (m) {
            html.push('<h2>' + m[1] + '</h2>');
            const after = m[2].trim();
            if (after) html.push('<p>' + after + '</p>');
          }
          i++; continue;
        }

        // 條列項目（-、•、✓、✗）
        if (/^[-•✓✗]\s?/.test(line)) {
          const items = [];
          while (i < lines.length) {
            const l = lines[i].trim();
            if (!l) break;
            if (/^[-•✓✗]\s?/.test(l)) {
              items.push('<li>' + l.replace(/^[-•✓✗]\s*/, '') + '</li>');
              i++;
            } else { break; }
          }
          html.push('<ul>' + items.join('') + '</ul>');
          continue;
        }

        // 數字條列（1. 2. 或 1) 2)）
        if (/^\d+[.)]\s/.test(line)) {
          const items = [];
          while (i < lines.length) {
            const l = lines[i].trim();
            if (!l) break;
            if (/^\d+[.)]\s/.test(l)) {
              items.push('<li>' + l.replace(/^\d+[.)]\s+/, '') + '</li>');
              i++;
            } else { break; }
          }
          html.push('<ol>' + items.join('') + '</ol>');
          continue;
        }

        // 一般段落：連續非空行合併，保留換行為 <br>
        const pLines = [];
        while (i < lines.length) {
          const l = lines[i].trim();
          if (!l) break;
          if (l.startsWith('[IMAGE:') || l.startsWith('【') ||
              /^[-•✓✗]\s?/.test(l) || /^\d+[.)]\s/.test(l)) break;
          pLines.push(l);
          i++;
        }
        if (pLines.length > 0) {
          html.push('<p>' + pLines.join('<br>') + '</p>');
        }
      }

      return html.join('');

    // 關閉文章
    function closePost() {
      document.getElementById('articleOverlay').classList.remove('open');

      const ld = document.getElementById('article-jsonld');
      if (ld) ld.remove();
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('articleOverlay')) closePost();

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closePost();
    });

    // 瀏覽器上一頁／下一頁鍵同步
    window.addEventListener('popstate', function(e) {
      if (e.state && e.state.postId) {
        expandPost(e.state.postId);
      } else {
        const overlay = document.getElementById('articleOverlay');
        if (overlay.classList.contains('open')) {
          overlay.classList.remove('open');
          document.body.style.overflow = '';
          restoreMeta();
          const ld = document.getElementById('article-jsonld');
          if (ld) ld.remove();
        }
      }
    });

    // 直接用分享連結進入時自動開啟文章（例如 ?p=sun-moon-lake）
    window.addEventListener('DOMContentLoaded', function() {
      const slug = new URLSearchParams(window.location.search).get('p');
      if (slug) {
        const post = blogPosts.find(p => p.slug === slug);

    // 初始化部落格
    renderBlog();

    // ===== 繁→簡轉換工具（中國版專用）=====
    const _isCN = window.location.hostname === 'leadercarrental779.pages.dev' || window.location.hostname.includes('edgeone.dev') || window.location.hostname.includes('edgeone.cool');

    const _t2s = {'們':'们','來':'来','時':'时','國':'国','會':'会','說':'说','對':'对','體':'体','裡':'里','這':'这','麼':'么','個':'个','為':'为','與':'与','從':'从','長':'长','發':'发','還':'还','後':'后','過':'过','電':'电','讓':'让','問':'问','當':'当','開':'开','關':'关','動':'动','樣':'样','帶':'带','導':'导','遊':'游','遠':'远','風':'风','區':'区','線':'线','點':'点','號':'号','圖':'图','熱':'热','處':'处','設':'设','備':'备','間':'间','邊':'边','歡':'欢','應':'应','種':'种','術':'术','產':'产','業':'业','實':'实','場':'场','幫':'帮','書':'书','現':'现','進':'进','歷':'历','灣':'湾','讚':'赞','專':'专','親':'亲','觀':'观','話':'话','傳':'传','總':'总','氣':'气','強':'强','決':'决','廣':'广','廳':'厅','廟':'庙','館':'馆','龍':'龙','鳥':'鸟','魚':'鱼','貓':'猫','麵':'面','溫':'温','農':'农','縣':'县','鎮':'镇','鄉':'乡','橋':'桥','賓':'宾','預':'预','訂':'订','費':'费','價':'价','錢':'钱','購':'购','賣':'卖','買':'买','選':'选','擇':'择','語':'语','讀':'读','寫':'写','聽':'听','聲':'声','覺':'觉','愛':'爱','樂':'乐','廚':'厨','濕':'湿','數':'数','據':'据','樓':'楼','層':'层','頁':'页','題':'题','標':'标','節':'节','頭':'头','頻':'频','鐘':'钟','鐵':'铁','錶':'表','鍋':'锅','鏡':'镜','顯':'显','覽':'览','護':'护','藝':'艺','藥':'药','螢':'萤','蝦':'虾','貝':'贝','貨':'货','貴':'贵','質':'质','趨':'趋','躍':'跃','軟':'软','輕':'轻','輛':'辆','輝':'辉','輸':'输','輪':'轮','運':'运','遷':'迁','鄰':'邻','醫':'医','銀':'银','錦':'锦','門':'门','閃':'闪','閒':'闲','閱':'阅','陽':'阳','隨':'随','險':'险','離':'离','難':'难','雲':'云','霧':'雾','靜':'静','頂':'顶','類':'类','飛':'飞','飲':'饮','飽':'饱','駕':'驾','髮':'发','鬆':'松','黃':'黄','臺':'台','颱':'台','賞':'赏','纜':'缆','棧':'栈','燈':'灯','紅':'红','綠':'绿','藍':'蓝','濃':'浓','縱':'纵','緩':'缓','縮':'缩','繞':'绕','絲':'丝','織':'织','繡':'绣','滿':'满','漢':'汉','灑':'洒','煙':'烟','燦':'灿','爛':'烂','爺':'爷','獨':'独','環':'环','盡':'尽','碼':'码','純':'纯','終':'终','緊':'紧','聯':'联','舊':'旧','艙':'舱','葉':'叶','蓮':'莲','蓋':'盖','視':'视','評':'评','辦':'办','遶':'绕','醬':'酱','錯':'错','閣':'阁','隱':'隐','響':'响','驗':'验','歸':'归','烏':'乌','瀑':'瀑','潑':'泼','潔':'洁','澄':'澄','瑩':'莹','璃':'璃','琴':'琴','獸':'兽','瓏':'珑','異':'异','癒':'愈','碩':'硕','礎':'础','窩':'窝','簡':'简','糾':'纠','紐':'纽','經':'经','綜':'综','網':'网','緣':'缘','繁':'繁','纖':'纤','縫':'缝','補':'补','褲':'裤','裝':'装','複':'复','製':'制','覆':'覆','詢':'询','詳':'详','該':'该','誰':'谁','講':'讲','調':'调','論':'论','諮':'咨','識':'识','警':'警','讓':'让','變':'变','辭':'辞','辯':'辩','連':'连','適':'适','遍':'遍','這':'这','鍵':'键','鬥':'斗','鹹':'咸','麗':'丽','龜':'龟'};

    function t2sConvert(str) {
      return str.replace(/./gu, c => _t2s[c] || c);
    }

    function walkAndConvert(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        const converted = t2sConvert(node.nodeValue);
        if (converted !== node.nodeValue) node.nodeValue = converted;
      } else if (node.nodeType === Node.ELEMENT_NODE &&
                 node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
        node.childNodes.forEach(walkAndConvert);
      }
    }

    // 中國版介面轉簡體
    if (_isCN) {
      document.documentElement.lang = 'zh-Hans';
      document.title = '博客 | 贺森包车旅游';

      const zhMap = [
        ['賀森部落格','贺森旅游日志'],
        ['台灣旅遊攻略、包車心得、景點介紹、旅遊故事與經驗分享','台湾旅游攻略、包车心得、景点介绍、旅游故事与经验分享'],

        ['立即預約','立即预约'],
        ['閱讀全文','阅读全文'],
        ['服務項目','服务项目'],
        ['豪華車隊','豪华车队'],
        ['熱門路線','热门路线'],
        ['部落格','旅游日志'],
        ['聯絡我們','联系我们'],
        ['首頁','首页'],
        ['包車旅遊','包车旅游'],
        ['貴賓感謝','贵宾感谢'],
        ['高雄旅遊','高雄旅游'],
        ['清境住宿','清境住宿'],
        ['環島包車','环岛包车'],
        ['嘉義旅遊','嘉义旅游'],
        ['日月潭旅遊','日月潭旅游'],
      ];

      function walkNodes(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          let t = node.nodeValue;
          for (const [tc, sc] of zhMap) {
            if (t.includes(tc)) t = t.split(tc).join(sc);
          }
          node.nodeValue = t;
        } else if (node.nodeType === Node.ELEMENT_NODE &&
                   node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
          node.childNodes.forEach(walkNodes);
        }
      }

      // 頁面載入後執行，確保動態渲染的文章卡片也套用
      setTimeout(function() { walkAndConvert(document.body); }, 50);
    }
